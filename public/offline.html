<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luna Let's Go - Offline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F4F7FB;
      color: #2a2a3e;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .container { text-align: center; max-width: 400px; }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #00447B;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      margin: 0 auto 24px;
      font-family: 'Poppins', sans-serif;
    }
    h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #00447B;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: #6C6D6F;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    button {
      padding: 12px 28px;
      background: #FF8210;
      color: #fff;
      border: none;
      border-radius: 100px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">L</div>
    <h1>You are offline</h1>
    <p>Your trip memories will be here when you reconnect. Any notes you saved before going offline are safe.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
